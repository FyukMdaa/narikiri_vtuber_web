<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vtuberなりきりソフト</title>
<link rel="stylesheet" href="./css/style.css">

<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three/build/three.module.js",
    "three/addons/": "./js/vendor/three/examples/jsm/",
    "@pixiv/three-vrm": "./js/vendor/three-vrm/three-vrm.module.js",
    "@mediapipe/tasks-vision": "./js/vendor/mediapipe/vision_bundle.mjs",
    "animated-data-qr": "./js/vendor/animated-data-qr/animated-data-qr.esm.js",
    "app/": "./js/"
  }
}
</script>
</head>
<body>

<div id="app">
  <div id="toolbar">
    <div class="brand"><span class="dot"></span>なりきりVtuber</div>

    <button class="tool-btn" id="btn-camera">
      <span id="btn-camera-label">カメラ開始</span>
    </button>

    <button class="tool-btn" id="btn-overlay" disabled>骨組み表示</button>

    <div class="divider-v"></div>

    <label class="tool-btn brightness-label" title="3Dモデルの明るさを調整">
      <span>明るさ</span>
      <input type="range" id="brightness-slider" min="0.2" max="3.0" step="0.1" value="1.0"
        style="width: 80px; accent-color: var(--accent); cursor: pointer;">
      <span id="brightness-val" style="font-size: 12px;">1.0</span>
    </label>

    <div class="divider-v"></div>

    <label class="tool-btn" id="zoom-label" title="顔の大きさに合わせてカメラズームを自動調整">
      <input type="checkbox" id="opt-zoom" checked>
      <span>顔追従ズーム</span>
    </label>

    <div class="divider-v"></div>

    <label class="tool-btn" id="hide-camera-label" title="カメラ映像を隠し、骨組み（トラッキング状況）だけを表示します">
      <input type="checkbox" id="opt-hide-camera">
      <span>映像を隠す（骨組みのみ）</span>
    </label>

    <div class="divider-v"></div>

    <button class="tool-btn" id="btn-load-vrm">
      VRM読み込み
    </button>
    <input type="file" id="vrm-input" accept=".vrm">

    <button class="tool-btn" id="btn-load-inp">
      Inp読込
    </button>
    <input type="file" id="inp-input" accept=".inp">

    <div class="divider-v"></div>

    <label class="tool-btn photo-btn" id="btn-photo" title="現在のアバター・カメラ・骨組みを撮影します（Space キーでも撮影可）">
      <span>撮影</span>
    </label>
    <select id="photo-layout-select" class="tool-btn photo-layout-select" title="フォトレイアウトを選択"></select>

    <div id="status-tag">READY</div>
  </div>

  <div id="stage">
    <div class="pane" id="pane-model">
      <div class="pane-label"><span class="idx">01</span> MODEL</div>
      <div id="model-canvas-wrap">
        <canvas id="three-canvas"></canvas>
        <canvas id="inochi-canvas" style="display:none;"></canvas>
      </div>
      <div id="fps-readout">-- fps</div>
      <div class="scanline"></div>
    </div>

    <div class="pane" id="pane-camera">
      <div class="pane-label"><span class="idx">02</span> CAMERA / TRACKING</div>
      <div id="camera-wrap">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
        <div class="pane-empty-hint" id="camera-empty-hint">
          <div class="glyph">◎</div>
          <div>「カメラ開始」を押してWebカメラへのアクセスを許可してください</div>
        </div>
      </div>
      <div class="scanline"></div>
    </div>
  </div>
</div>

<!-- ── フォトモーダル ── -->
<dialog id="photo-modal" class="photo-modal" aria-labelledby="photo-modal-title">
  <div class="photo-modal-body">
    <div class="photo-modal-header">
      <div>
        <span class="kicker">PHOTO</span>
        <h2 id="photo-modal-title" class="photo-modal-title">撮影結果</h2>
      </div>
      <button id="photo-modal-close" class="photo-modal-close" type="button" aria-label="閉じる">&times;</button>
    </div>

    <div class="photo-modal-content">
      <!-- 左: 選択されたフォト -->
      <div class="photo-pane">
        <div class="photo-pane-label">PHOTO</div>
        <div class="photo-pane-frame">
          <img id="photo-modal-img" alt="captured photo" />
        </div>
        <div class="photo-pane-actions">
          <button id="photo-download" class="tool-btn" type="button">ダウンロード</button>
          <button id="photo-retake" class="tool-btn" type="button">撮り直す</button>
        </div>
        <div id="photo-meta" class="photo-meta"></div>
      </div>

      <!-- 右: データ転送 QR -->
      <div class="photo-pane qr-pane">
        <div class="photo-pane-label">DATA TRANSFER QR</div>
        <div id="qr-stage-mount" class="qr-stage-mount"></div>
        <div class="qr-controls">
          <button id="qr-start" class="tool-btn active" type="button">送信開始</button>
          <button id="qr-stop" class="tool-btn" type="button">一時停止</button>
        </div>
        <div id="qr-status" class="qr-status">準備中…</div>
        <div class="qr-hint">
          受信側（もう一台の端末）のカメラで QR を読み取ってください。アニメーション QR で順次データが転送されます。
        </div>
      </div>
    </div>
  </div>
</dialog>

<script type="module" src="./js/main.js"></script>

</body>
</html>
